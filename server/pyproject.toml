[project]
name = "hack-star-server"
version = "0.1.0"
description = "Hack star game server"
authors = [
    { name = "Martin Nordio", email = "martin.nordio@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
hack-star-server = "hack_star_server:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
]
