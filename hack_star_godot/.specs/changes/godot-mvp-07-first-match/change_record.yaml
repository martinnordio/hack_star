breaking: |
  Play no longer opens the dummy arena: it starts a match; the dummy arena is now Training.
  Nothing saved changes; no server call.
review:
  - question: Why does the match inherit arena.tscn instead of copying it?
    answer: |
      D1: the canyon, the player, the camera, the sticks, Back and the FPS label stay one scene;
      Arena gets class_name and training (only then dummies); MatchArena adds bots, Match and the
      HUD. Training stays the spec 06 demo with its tests.
  - question: How are the bots tested without flaky randomness?
    answer: |
      D5, D8: BotBrain and MatchArena take a RandomNumberGenerator that tests seed; the brain is
      pure (positions in, {move, aim} out), so sight, reaction, aim error and wandering are
      checked without a scene (16 tests), and the arena tests seed the match.
  - question: Can a fighter hit itself with its own shot?
    answer: |
      No: Shot.launch takes the shooter and excludes its RID from every ray (D6); tested
      point-blank in test_fighter_health.gd. Fighters still do not block each other.
  - question: Does a match change saved progress or call the server?
    answer: |
      No (D12, S16): match_settings and last_result are session only; trophies come with spec 08;
      server/ and ui/ are unchanged (git diff --stat 369a9f2..ec6f78d -- server ui is empty).
