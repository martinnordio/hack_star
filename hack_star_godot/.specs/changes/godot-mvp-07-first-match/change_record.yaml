# yaml-language-server: $schema=../../../../.specs/kit/review/change_record.schema.json
# Change record of spec 07 on feature/godot-mvp (written by REVIEW:, 2026-11-21).
# Range: this spec's commits only, 369a9f2..ec6f78d (the branch carries specs 03-08 and 16).
# spec.path is relative to hack_star_godot/ (the Godot project root): the kit schema only
# accepts paths that start with ".specs/".
# Screens and timings: a windowed Godot 4.7.2 run with a temporary capture script (in the
# git-ignored build/, removed); Before from a temporary worktree at 369a9f2 (removed).
# Outputs: a temporary headless script (removed). Settings and tokens: git show of both revisions.
version: 1
branch: feature/godot-mvp
base: 369a9f2
why: |
  Hack star can be played, but nothing shoots back and nobody wins. Spec 07 adds the first real
  match, a "last fighter standing" fight against bots like Showdown in Brawl Stars: health,
  healing, knock-outs, a countdown, a timer, a result screen, and Training on home for the
  dummy arena of spec 06. The numbers Mattia still has to choose are settings in one place.
spec:
  path: .specs/features/2026_11_12_07_first_match_spec.md
  statements: [S1, S2, S3, S4, S5, S6, S7, S8, S9, S10, S11, S12, S13, S14, S15, S16]
