  - id: arena-performance
    kind: performance
    change: modified
    object: Arena load and frame rate (windowed desktop, 1280x720)
    note: The arena is ready about 170 ms later (canyon built in code at _ready) and still runs at the 60 fps vsync cap while running and firing. Not a browser or device number (S10 stays with the author).
    statements: [S10]
    examples:
      - name: windowed-1280x720
        input: |
          same script, 3 runs per side: ms from instantiate to the second frame; frames per
          second over 6 s walking a square (after: also fire(UP) every 0.1 s)
breaking: none
review:
  - question: Why build the canyon in code instead of a .tscn?
    answer: |
      D2: the layout is data (ArenaLayout), so tests check the start, the dummies and the bushes
      against the walls without a scene, and Canyon builds walls, cacti and decoration from the
      same data. MultiMeshes keep the draw calls low (S10); all art is own art (spec 03, S7).
  - question: How does a touch never fire twice?
    answer: |
      D7: the arena reads the mouse in _unhandled_input (Back takes its click first) and ignores
      mouse events with DEVICE_ID_EMULATION, which Godot makes from touches; the sticks read
      InputEventScreenTouch. Tests push real events for both cases.
  - question: Why is the fighter see-through by swapped materials?
    answer: |
      D11's fallback: GeometryInstance3D.transparency did nothing in the Compatibility renderer
      (Step 7 screenshot), so FighterModel swaps each mesh's material for a cached alpha copy.
  - question: Does the arena change anything outside it?
    answer: |
      No server call and no save (D12); server/ and ui/ are unchanged. The home, list, fighter,
      info, hack and QR screens are untouched; their tests pass (224 in total).
