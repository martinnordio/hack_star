          the east border, the centre rock and the dummy at (4, -2.5), then arena.fire(direction);
          the Shot's ended(position, hit) recorded
  - id: physics-layers
    kind: config
    change: modified
    object: Physics layers (project.godot [layer_names], fighter and dummy layers, D13)
    note: 1 world, 2 fighter, 3 targets; the fighter (layer 2) collides with world and targets, so it cannot walk through a dummy; shots cast against world + targets.
    statements: [S3, S4]
    examples:
      - name: settings
        input: |
