breaking: |
  none for players and saves: version 3 saves load (an old save gets Flarekid and Echo
  unlocked), the view, the preset and the boost are not saved, the server and the Python +
  Svelte game are unchanged. For code: FighterStage.show_fighter does nothing when the same
  fighter and skin are shown again (it used to rebuild the model), and the arena's camera is
  placed by Arena.view_pose instead of look_at_from_position.
review:
- question: Why a picture on a camera-facing quad instead of the delivered Sprite3D scenes?
  answer: |
    D21: a Sprite3D cannot draw an outline of a fixed pixel width, flash, flip or fade.
    cutout.gdshader turns the quad to the camera in the vertex shader (the rig's yaw no
    longer matters), rings the picture's alpha for the outline and has the uniforms
    flash, fade, flip, tilt and tip; FighterModel's rig/body keep the idle, run and
    recoil code working. The delivered scenes stay in characters/ and out of the export.
- question: Why does the camera never turn in the Behind view?
  answer: |
    D25/V4 (Q12): with a fixed yaw (always looking north) the movement keys keep their
    screen direction in every view and the picture fighters still face the camera.
    Behind stands 6 m behind the fighter at the height where its line to a point 4 m ahead
    is 28 degrees down (Step 25 Notes).
- question: How do the lighting presets keep each world's own look?
  answer: |
    D27: WorldLighting remembers the world's own sun, ambient and sky after the world is
    built, applies a preset to a fresh copy of the environment (the scene's shared one is
    never changed) and keeps 30 % of the world's colours (WORLD_SHARE). Classic brings the
    world's light back exactly; glow is on only in Neon night (checked on the desktop and
    in the web export).
- question: What keeps the author's newer art out of git and the web export?
  answer: |
    D22/D31: .gitignore names the zips and scenes/blaze_godot/; export_presets.cfg's
    exclude_filter names the delivery's preview files and characters/*_new/*,
    characters/magmax*/* and characters/*.zip. A clean export at f10d71c and Step 29's
    working-tree export are both 41,244,423 bytes; the .pck holds no excluded name.
