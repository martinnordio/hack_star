    note: Three outcomes ok / unknown / no_server; a 200 with an id the game does not know is unknown; any status other than 200 and 404 is no_server (finding 4).
    statements: [S2, S7, S11, S13]
    examples:
      - name: redeem
        input: |
          same script: HackServer.redeem(" power22 ") with fake_responder answers 200 (power22),
          200 (hypercharge), 404, 422, 500, 200 with broken JSON and 0 (no connection)
  - id: qr-encoder
    kind: output
    change: added
    object: QR code encoder (game/qr_code.gd, QrCode)
    note: Byte mode, level M, versions 1-10; the GUT tests compare four matrices bit for bit with segno 1.6.6.
    statements: [S10]
    examples:
