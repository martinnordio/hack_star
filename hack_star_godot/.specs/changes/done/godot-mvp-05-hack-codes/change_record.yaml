    note: New autoload HackServer; the Web preset loads jsQR.js and qr_scanner.js with html/head_include and turns on the virtual keyboard.
    statements: [S3, S13, S15]
    examples:
      - name: settings
        input: |
          git show <rev>:hack_star_godot/project.godot ([autoload]) and
          git show <rev>:hack_star_godot/export_presets.cfg (html/head_include,
          html/experimental_virtual_keyboard)
  - id: dependencies
    kind: dependency
    change: modified
    object: Pinned tools and shipped scripts (tools/versions.json, web/)
    note: cryptography 50.0.2 pinned for make_cert.py only (D3); jsQR 1.4.0 shipped in the web export with its licence (D8, LICENSES.md).
    statements: [S3, S15]
    examples:
      - name: versions
        input: |
          git show <rev>:hack_star_godot/tools/versions.json, and the files under web/
breaking: none
review:
  - question: Why does the Godot game call the Python server instead of checking codes itself?
    answer: |
      D1 and spec 03: one server for both games so they share the codes; the codes are not
      written in the Godot code. server/ and ui/ are unchanged (git diff is empty there).
  - question: Can a hack corrupt progress?
    answer: |
      No. D4: effects are computed from active_hacks at read time; trophies, unlocks and power
      levels are never written. Turning all hacks off only clears the list (S9).
  - question: Why a GDScript QR encoder and a JavaScript decoder?
    answer: |
      D10: drawing a QR code needs no library and works headless for the tests (checked bit for
      bit against segno). D8: Godot has no camera QR decoder and Safari has no BarcodeDetector,
      so jsQR runs in the page with an HTML video overlay, as in the Svelte game.
  - question: How does the phone reach the server?
    answer: |
      D3: serve_web.ps1 serves the export and forwards /api to the server on this computer, so
      the page's own origin + /api works on the Wi-Fi too; -Https adds a self-signed certificate
      because the camera needs https:// away from localhost.
