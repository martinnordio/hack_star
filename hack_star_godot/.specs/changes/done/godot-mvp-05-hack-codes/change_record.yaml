  - id: web-proxy
    kind: output
    change: added
    object: Local web setup (tools/serve_web.py) - /api forwarded at the page's address
    note: The page and /api share one address; with the server down /api answers 502 so the game shows the S13 message.
    statements: [S13, S15]
    examples:
      - name: server-up
        input: |
          cd server; uv run hack-star-server
          uv run --no-project python tools/serve_web.py --port 8060 --bind 127.0.0.1 --directory build/web
          curl / ; curl /api/hacks ; POST /api/hacks/redeem " power22 " and "nope"
      - name: server-down
        input: |
          the server stopped, serve_web.py still running: curl /api/hacks
  - id: serve-web-command
    kind: command
    change: modified
    object: tools/serve_web.ps1
    note: New -ApiUrl and -Https; it now runs serve_web.py (forwarding /api) instead of http.server, and makes a self-signed certificate with make_cert.py for -Https.
    statements: [S15]
    examples:
