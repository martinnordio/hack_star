    object: Save file user://hack_star_save.json (game/save_data.gd, GameState)
    note: '{"version": 1, "hacks": [...]}; broken, newer or unknown content gives no hacks or drops the unknown ids. The first saved data of the Godot game.'
    statements: [S8, S9]
