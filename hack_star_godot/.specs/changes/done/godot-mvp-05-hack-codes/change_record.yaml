# yaml-language-server: $schema=../../../../.specs/kit/review/change_record.schema.json
# Change record of spec 05 on feature/godot-mvp (written by REVIEW:, 2026-11-21).
# Range: this spec's commits only, 94ba207..b0bdc6d (the branch carries specs 03-08 and 16).
# spec.path is relative to hack_star_godot/ (the Godot project root): the kit schema only
# accepts paths that start with ".specs/".
# Screens: real screenshots of a windowed Godot 4.7.2 run (temporary capture script under the
# git-ignored build/, removed); HackServer.fake_responder answers as the server does, so the
# screens do not need the server. Before comes from a temporary worktree at 94ba207 (removed).
# Proxy: the real server (cd server; uv run hack-star-server) and tools/serve_web.py, curl.
version: 1
branch: feature/godot-mvp
base: 94ba207
why: |
  Hack codes are what makes Hack star different from Brawl Stars: a secret code or a QR code
  gives unlimited credits, every fighter unlocked, or power levels up to 22. Spec 05 brings
  them to the Godot game with the existing FastAPI server (shared codes), the first save file
  (the active hacks), a QR page to print, camera scanning in the browser, and the local web
  setup that serves the export with the server's /api at the same address.
spec:
  path: .specs/features/done/2026_11_21_05_hack_codes_spec.md
  statements: [S1, S2, S3, S4, S5, S6, S7, S8, S9, S10, S11, S12, S13, S14, S15]
changes:
  - id: home-screen
    kind: ui
    change: modified
    object: Home screen (scenes/home.tscn) - Hack button and credits
    note: A fourth button **Hack** under Fighters and Info (the row is now an HFlowContainer, so it wraps); credits go through Hacks.credits_text and show ∞ with the unlimited-credits hack.
    statements: [S1, S4]
    examples:
      - name: desktop-1280x720
        input: |
          godot --path hack_star_godot --resolution 1280x720 -s <temporary capture script>
          (home, entrance already played, no hacks, 1.5 s)
        views: [desktop]
      - name: phone-portrait-390x844
        input: |
          same at --resolution 390x844
        views: [phone-portrait]
      - name: infinity-1280x720
        input: |
          same at 1280x720 with GameState.activate_hack("infinite_credits") (after only)
        views: [desktop]
  - id: fighter-list
    kind: ui
    change: modified
    object: Fighter list and fighter screen - power with its maximum, locks follow the hacks
    note: '"Power: 7" becomes "Power 7 / 11" (S6); with all three hacks every card is unlocked and shows "/ 22". The fighter screen uses the same Hacks.power_text.'
    statements: [S5, S6, S12]
    examples:
      - name: desktop-1280x720
        input: |
          godot --path hack_star_godot --resolution 1280x720 -s <temporary capture script>
          (scenes/fighter_list.tscn, no hacks, 2.5 s)
        views: [desktop]
      - name: all-hacks-1280x720
        input: |
          same with infinite_credits, unlock_all and power22 active (after only)
        views: [desktop]
  - id: hack-screen
    kind: ui
    change: added
    object: Hack screen (scenes/hack_screen.tscn, Screens.HACK)
    note: Code field with Use code (and Enter), Scan QR code, message, Active hacks list, Turn all hacks off (with a confirmation), QR codes; a correct code pops the message and bursts stars for 1.8 s.
    statements: [S1, S2, S3, S7, S8, S9, S13, S14]
    examples:
      - name: desktop-1280x720
        input: |
          godot --path hack_star_godot --resolution 1280x720 -s <temporary capture script>
          (hack screen, power22 and infinite_credits active)
        views: [desktop]
      - name: phone-portrait-390x844
        input: |
          same at --resolution 390x844
        views: [phone-portrait]
      - name: celebration-1280x720
        input: |
          hack screen, no hacks, submit(" opensesame ") with a fake 200 unlock_all answer,
          captured 0.6 s later
        views: [desktop]
  - id: qr-page
    kind: ui
    change: added
    object: QR page (scenes/qr_page.tscn, Screens.QR)
    note: One card per known hack of GET /api/hacks (hypercharge and creator left out) with name, code, a 320 px QR image of the D9 link and Save image.
    statements: [S10, S11, S13]
    examples:
      - name: desktop-1280x720
        input: |
          godot --path hack_star_godot --resolution 1280x720 -s <temporary capture script>
          (QR page, fake list answer with the three hacks and hypercharge)
        views: [desktop]
      - name: phone-portrait-390x844
        input: |
          same at --resolution 390x844
        views: [phone-portrait]
  - id: hack-rules
    kind: output
    change: added
    object: Hack rules (game/hacks.gd, Hacks)
    note: Effects are computed from the list of active ids, never written into progress; code_from_scan accepts a plain code or a ?hack= link.
    statements: [S2, S3, S4, S5, S6, S11, S12]
    examples:
      - name: outputs
        input: |
          godot --headless --path hack_star_godot -s <temporary script>
