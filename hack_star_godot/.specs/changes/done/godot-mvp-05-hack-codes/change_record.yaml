        input: |
          Get-Help tools\serve_web.ps1 -Full
  - id: export-web-command
    kind: command
    change: modified
    object: tools/export_web.ps1
    note: Also copies web/*.js (jsQR and the camera scanner) next to index.html; exit 1 when none is found.
    statements: [S3]
    examples:
