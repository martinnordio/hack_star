# yaml-language-server: $schema=../../../../.specs/kit/review/change_record.schema.json
# Change record of spec 09 Better Graphics (#35) on feature/better-graphics (written by REVIEW:,
# 2026-11-22). Range: 91cc8be..060ff79 (requirements, plan and Steps 1-20).
# spec.path is relative to hack_star_godot/ (the Godot project root): the kit schema only
# accepts paths that start with ".specs/". The schema only accepts statement ids S<n>; this spec
# also has the groups G, W, A and B, so each block lists its S<n> under `statements` and names
# its G/W/A/B statements in its `note` (finding 9).
# Screens: a windowed Godot 4.7.2 run with a temporary capture script (-s, removed), the same
# script on both sides: GameState.save_path = user://review09/save.json, GameState.reset()
# (sample progress, Blaze, never the player's file), entrance skipped; PNG of the root viewport
# after a fixed wait. Before from a temporary worktree at 91cc8be, after from a temporary
# worktree at HEAD without the author's untracked files (both removed). Outputs: a temporary
# headless probe, the same source on both sides. Matches use random bots, so the two match
# pictures show different moments of the same setup.
version: 1
branch: feature/better-graphics
base: 91cc8be
why: |
  The author and Mattia found the Godot game's screens and characters much worse than the
  Python + Svelte game (flat navy screens, default font, five identical purple buttons, a thin
  outline, a yellow checker floor with a wall over a quarter of the match). Spec 09 gives every
  screen and fighter an outlined cartoon look like the Svelte game, adds a second world
  (Glimmer Isles, placed with ProtonScatter and baked), turns Mattia's drawing into a fighter
  (Beatbolt) and recommends a drawing-to-3D workflow.
spec:
  path: .specs/features/done/2026_11_21_09_better_graphics_spec.md
  statements: [S2, S3, S4, S5, S6]
