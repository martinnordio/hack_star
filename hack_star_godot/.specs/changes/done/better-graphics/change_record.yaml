breaking: |
  none for players and saves: version 3 saves load (an old save gets Beatbolt unlocked), the
  server and the Python + Svelte game are unchanged. For code: Hacks.credits_text was renamed
  Hacks.credits_amount (no other caller), and the HUD and card labels became IconChips (node
  paths TimerLabel, FightersLeftLabel, TrophiesLabel, PowerLabel, LockLabel are gone).
review:
  - question: Why is ProtonScatter's result baked instead of running in the game?
    answer: |
      D12/W5: ProtonScatter rebuilds on a Thread at load, which the single-threaded web export
      cannot rely on and which costs start-up time. tools/bake_world.ps1 rebuilds it on the main
      thread once and saves plain MultiMeshInstance3D nodes; the game never loads addon code
      (test_glimmer_isles.gd checks baked.tscn has no addon path), and the addon is excluded
      from the export.
  - question: Why a screen-space inverted hull instead of Godot's grow outline?
    answer: |
      D5/G9: the old 0.022 m grow vanished at card size. outline.gdshader grows each vertex out
      from the part's centre by 0.012 m and then by 3 px on screen (scaled above 720 px), so the
      outline reads on a 150 px card and in the arena. It costs one extra pass per outlined mesh
      (Training 384 -> 539 draw calls on the desktop, Step 5); the iPad check is deferred.
  - question: How does the arena pick its world without changing Arena's logic?
    answer: |
      D9: ArenaLayout.use(GameState.world) swaps the active layout (static variables) and the
      functions and accessors read it; Arena handles NOTIFICATION_SCENE_INSTANTIATED to replace
      its Canyon node with GlimmerIsles before any child is ready. The canyon constants are
      unchanged (W7).
  - question: How is a drawn fighter added or removed?
    answer: |
      D14/A9: a look file scenes/drawn/<id>_model.gd, a row in DrawnFighters.MODELS, an entry in
      Fighters.LIST ("drawn": true, "plays_like") and two SampleProgress numbers. A save that
      chose a removed fighter falls back to Blaze (test_drawn_fighter.gd); docs/drawing_to_fighter.md.
