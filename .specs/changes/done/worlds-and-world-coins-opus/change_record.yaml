        input: |
          route=/ then Play
        views: [desktop, phone]
breaking: |
  Saves move to version 8 (older game versions cannot read them). In rooms, friends on the
  previous version can only play in Canyon Small; in another world they are removed and told to update.
review:
  - question: Why generated maps instead of hand-made ones?
    answer: |
      39 maps would be slow to write and review (D3). Each world and size has a fixed seed; a seed
      whose map shuts a spawn, the start or a dummy away from the centre is skipped, and the tests
      check every map.
  - question: Can a world-coin code be used early?
    answer: |
      Only by clearing the browser's data: the dates live in the account on the device (D10).
      Server-side tracking is a deferred item.
  - question: Why does a reset in one tab not come back from the other tab's larger values?
    answer: |
      The "larger value" merge (sizes, steps, code dates) applies only when both tabs changed the
      field; when only this tab changed it, its value wins.
