    note: Opened by Play, Training and a room's start; choose, buy and grow worlds.
    statements: [S1, S3, S8, S11, S13, S22, S23]
    extraction: manual
    manual_reason: The screen opens only after a tap on Play, which the headless screenshot cannot do, and the integrated browser crops screenshots to its small window. Checked by eye at four sizes in Step 5 (see its Notes).
