# yaml-language-server: $schema=../../../kit/review/change_record.schema.json
version: 1
branch: feature/worlds-and-world-coins-opus
base: 2cf090e
why: |
  Every match and Training session was played in the same arena, the same size. Players asked
  for several worlds in a small, medium and large size, so matches feel different. Free worlds
  come in Small; other worlds and bigger sizes are unlocked with a new currency, world coins,
  earned per 500 trophies or from hack codes each account can use once every 30 days.
spec:
  path: .specs/features/done/2026_11_16_worlds_and_world_coins_opus_spec.md
  statements: [S1, S2, S3, S4, S5, S6, S7, S8, S9, S10, S11, S12, S13, S14, S15, S16, S17, S18, S19, S20, S21, S22, S23, S24]
