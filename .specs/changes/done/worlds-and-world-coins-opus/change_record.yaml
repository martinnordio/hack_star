    change: added
    object: WORLDS, SIZE_DIMENSIONS and arenaFor(id, size)
    note: 13 worlds (3 free), three sizes; more cover on more ground; Canyon Small is the old CANYON.
    statements: [S2, S3, S4, S5]
    examples:
