# yaml-language-server: $schema=../../../kit/review/change_record.schema.json
version: 1
branch: feature/worlds-and-world-coins
base: 2cf090e
why: |
  Every match and every Training session was played in the same arena, the same size. Players
  want to choose between several worlds, each in Small, Medium and Large, so matches feel
  different and bigger worlds mean more running. Three worlds are free in Small; the others and
  the bigger sizes are unlocked with a new currency, world coins, earned per 500 trophies or from
  special hack codes that each account can use again after 30 days.
spec:
  path: .specs/features/done/2026_11_16_worlds_and_world_coins_spec.md
  statements: [S1, S2, S3, S4, S5, S6, S7, S8, S9, S10, S11, S12, S13, S14, S15, S16, S17, S18, S19, S20, S21, S22, S23, S24]
changes:
  # ── Screens ──────────────────────────────────────────────────────────────
  - id: world-screen
    kind: ui
    change: added
    object: World screen (opened by Play, Training and the room host's START)
    note: Every world with Small / Medium / Large; unlocked sizes choose, the next one shows its price and asks to confirm, too few coins disables Buy with "N more world coins needed"; START plays the choice.
    statements: [S1, S3, S8, S11, S12, S13, S22, S23]
    examples:
      - name: rich-account
        input: |
          route=/ → PLAY, account with 800 world coins, free worlds in Small,
          Jungle Ruins chosen in Small
        views: [desktop, phone]
      - name: too-few-coins
        input: |
          route=/ → PLAY, account with 300 world coins, tap Sky Islands · Large (1000)
        views: [phone]
  - id: home-balance
    kind: ui
    change: modified
    object: Home screen header (world-coin chip next to the credits)
    note: A 🌍 chip with the account's world coins now sits left of the credits chip; check it fits on a phone in portrait.
    statements: [S8, S23]
    examples:
      - name: header
        input: |
          route=/, account with 750 world coins and 500 credits
        views: [desktop, phone]
  - id: result-world-coins
    kind: ui
    change: modified
    object: Match result screen (world-coin line)
    note: "\"+250 world coins\" appears under trophies and credits only when the match crossed a new 500-step of total trophies."
    statements: [S9, S22]
    extraction: manual
    manual_reason: A won match that crosses a 500-step cannot be played by script on either side (Step 5 checked it only with a temporary forced value); the earning rule itself is shown by the world-coin-earning block.
    examples:
      - name: crossing-500
        input: |
          account with 495 total trophies (Blaze 495), win a match (+10 trophies) → result screen
        views: [desktop]
  - id: hack-screen
    kind: ui
    change: modified
    object: Hack screen (world-coin codes and the used-codes list)
    note: A world-coin code adds its coins and is celebrated; the same code again is refused with the date it works again; a list "Used world-coin codes" shows each code's date.
    statements: [S14, S15, S16, S22, S23]
    examples:
      - name: redeem-twice
        input: |
          route=/ → Hacks, enter the code of world_500_1 (world_codes.py), then enter it again;
          clock fixed at <timestamp>
        views: [desktop, phone]
  - id: qr-page
    kind: ui
    change: modified
    object: /?qr print page (world-coin codes)
    note: After the existing password, 15 cards instead of 5; the ten world-coin cards read "500 / 1000 world coins" and "Once every 30 days for each player."
    statements: [S18, S22]
    examples:
      - name: after-password
        input: |
          route=/?qr, the QR password entered (API running)
        views: [desktop]
  - id: friends-lobby
    kind: ui
    change: modified
    object: Friends' room lobby (older-game tag and removal notice)
    note: 'A friend without a room version is tagged "Older game: plays only in Canyon · Small"; after a start elsewhere the host reads who had to leave and why.'
    statements: [S7, S22]
    examples:
      - name: old-friend-removed
        input: |
          host (this version) with Neon Docks · Large chosen creates a room; a friend joins with a
          raw WebSocket member without "version"; host → START → world screen → START → back to the lobby
        views: [desktop]
  - id: world-gallery
    kind: ui
    change: added
    object: /?gallery=worlds developer view
    note: Shows one world and size with its theme (ground, border, walls, cover) and a data-fps value; /?gallery without the parameter still shows the fighters.
    statements: [S4, S5, S23]
    examples:
      - name: lava-forge-large
        input: |
          route=/?gallery=worlds&world=lava-forge&size=large
        views: [desktop]

  # ── Game rules ───────────────────────────────────────────────────────────
  - id: world-catalogue
    kind: output
    change: added
    object: WORLDS and arenaFor(worldId, size) (ui/src/lib/game/worlds.ts)
    note: 13 worlds (3 free) and a seeded mirror-symmetric layout per size; Small 30×24, Medium 36×30, Large 42×34 with more walls and bushes; Canyon Small is exactly today's CANYON.
    statements: [S2, S3, S4, S5]
    examples:
      - name: catalogue
        input: |
          WORLDS.map((w) => [w.id, w.free])
      - name: canyon-sizes
        input: |
          (['small', 'medium', 'large'] as const).map((s) => {
            const a = arenaFor('canyon', s)
            return { size: s, width: a.width, depth: a.depth, walls: a.walls.length,
                     bushes: a.bushes.length, spawns: a.spawns.length }
          })
          JSON.stringify(arenaFor('canyon', 'small')) === JSON.stringify(CANYON)
  - id: world-looks
    kind: output
    change: modified
    object: buildArena(arena, theme) and WORLD_LOOKS (ui/src/lib/models/arena3d.ts)
    note: One look per theme from simple shapes, merged by material into a few draw calls; Canyon must draw exactly as before (triangles, positions, colours).
    statements: [S4, S5, S23]
    examples:
      - name: canyon-unchanged
        input: |
          fingerprint(buildArena(CANYON))   # triangle count, mesh count, bounding box, colours
      - name: candy-large
        input: |
          fingerprint(buildArena(arenaFor('candy-factory', 'large'), 'candy'))
  - id: world-coin-earning
    kind: output
    change: added
    object: worldCoinsFor / earnWorldCoins (ui/src/lib/game/worldShop.ts) and saveReward after a match
    note: 250 world coins for each new 500-step of total trophies, paid once per step; a step reached again after losing trophies pays nothing.
    statements: [S9, S10]
    examples:
      - name: steps
        input: |
          [worldCoinsFor(499, 509, 0), worldCoinsFor(990, 1010, 1),
           worldCoinsFor(1010, 990, 2), worldCoinsFor(990, 1005, 2), worldCoinsFor(480, 1020, 0)]
  - id: world-shop
    kind: output
    change: added
    object: buyWorld, growWorld, worldOffers, chooseWorld, chosenWorld (ui/src/lib/game/worldShop.ts)
    note: 500 / 750 / 1000 for a new world, +250 per next size; refusals 'world-coins' with the missing amount, 'owned', 'locked'; credits and hacks never count; a locked choice falls back to Canyon Small.
    statements: [S1, S10, S11, S12, S13]
    examples:
      - name: buy-and-grow
        input: |
          p = { ...startProgress(), worldCoins: 800, credits: Infinity, activeHacks: ['unlock_all'] }
          [buyWorld(p, 'lava-forge', 'small'), growWorld(p, 'jungle-ruins'),
           buyWorld(p, 'sky-islands', 'large'), buyWorld(p, 'canyon', 'small'),
           growWorld(p, 'moon-base')]   # show ok / reason / missing / cost / worldCoins
      - name: offers-and-choice
        input: |
          p = { ...startProgress(), worldCoins: 300 }
          worldOffers(p, 'canyon'); worldOffers(p, 'sky-islands')
          chosenWorld(chooseWorld(p, 'sky-islands', 'small'))
  - id: bot-seek
    kind: output
    change: modified
    object: Bots.think — seek rule (ui/src/lib/game/bots.ts)
    note: A bot that has seen nobody for 6 seconds (SEEK_AFTER_SECONDS) walks towards the nearest opponent still in, instead of wandering; sight is unchanged.
    statements: [S6]
    examples:
      - name: out-of-sight
        input: |
          World(arenaFor('neon-docks', 'large')), player at (-18, -14) standing still, one bot at (18, 14),
          bot level easy, fixed random seed; distance bot → player after 0 s, 6 s and 12 s
      - name: bots-only-large
        input: |
          Match(arenaFor('lava-forge', 'large'), SETTINGS with 3 bots, every fighter a bot),
          fixed random seed; phase and time when the match ends
      - name: hidden-in-bush
        input: |
          World(CANYON), player standing still inside CANYON.bushes[0] (-9, -7), one easy bot at the
          spawn farthest from it (13, 8), fixed random seed; distance bot → player after 0 s, 6 s and 12 s
          (added by REVIEW: — shows the seek rule in Canyon Small)

  # ── Saved progress ───────────────────────────────────────────────────────
  - id: saved-progress-v8
    kind: data-format
    change: modified
    object: hack-star.accounts progress (version 8)
    note: Adds worldCoins, worldSteps, worlds, selectedWorld, worldCodes; v2–v7 saves migrate with the free worlds in Small, Canyon Small and 250 world coins per 500-step already reached; reset clears all five.
    statements: [S8, S19, S20, S21]
    examples:
      - name: migrate-v7
        input: |
          parseProgress({ version: 7, credits: 500, trophies: { blaze: 1000, rocko: 240 }, ...rest of a v7 save })
      - name: reset
        input: |
          resetProgress({ ...startProgress(), worldCoins: 900, worldSteps: 4,
            worlds: { canyon: 'large', 'lava-forge': 'small' }, selectedWorld: { id: 'lava-forge', size: 'small' },
            worldCodes: { world_500_1: <timestamp> } })
  - id: progress-merge
    kind: output
    change: modified
    object: Two-tab merge of an account's progress (mergeProgress in ui/src/lib/accounts.ts)
    note: worldCoins merge as a delta (with a refund when both tabs bought the same world), worlds keep the bigger size, worldSteps the larger, worldCodes the later date, selectedWorld the local change; a reset wins.
    statements: [S13, S19, S21]
