breaking: |
  None for players on this version: v2–v7 saves migrate and get world coins for trophies already
  reached; Canyon Small plays exactly as before. Friends on the previous version can still join
  and play rooms in Canyon Small; when the host starts in any other world or size the server
  removes them with "update-the-game" (S7, by design). As with earlier versions, a v8 save is
  not read by the previous version of the game.
review:
  - question: Do old saves keep everything, and can the trophy world coins be paid twice?
    answer: |
      They keep everything and get the free worlds in Small with Canyon Small chosen. The
      migration pays 250 per 500-step already reached and stores worldSteps, so later matches
      only pay steps above it (S9, S20; 1240 trophies → 500 world coins).
  - question: Do today's matches in Canyon change?
    answer: |
      No. arenaFor('canyon', 'small') returns CANYON itself, and a test pins Canyon's 3D build
      (triangles, positions, colours) to the previous one; only the bot seek rule after 6 s
      without seeing anybody is new in every world (D2, D5).
  - question: Can a player use a world-coin code again early?
    answer: |
      Only by clearing the browser's data or resetting the account: the codes are checked by the
      server, but the "used" dates live in the account's saved progress (D10). The game has no
      server accounts; server-side tracking is a Deferred Item.
  - question: What does a friend on the previous version see?
    answer: |
      In Canyon Small, nothing changes. Elsewhere the server sends the existing room-error
      message with the reason "update-the-game", which older games show as it is; the host's
      lobby says who had to leave and why (D11).
