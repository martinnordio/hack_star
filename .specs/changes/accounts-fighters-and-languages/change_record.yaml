breaking: |
  none — saved progress is migrated (the old key is kept), the API only adds fighters, skins
  and a hack, and a room member without the new field is read as before.
review:
  - question: Does progress saved before this version survive?
    answer: |
      Yes. The first start copies hack-star.progress (version 2 or 3) into account "Player 1"
      and leaves the old key, so going back to the previous version also works.
  - question: Why does the created fighter's look travel in the skin id?
    answer: |
      Pictures, the 3D stage, the arena and room members already pass a skin id (max 20
      characters). A 16-character code ("L" + type + head + body + 2 colours) made them work
      unchanged; only the name is sent separately to friends.
  - question: Is the QR password secure?
    answer: |
      No, on purpose: it is checked in the browser and is in the public code; it keeps kids
      from printing the codes (agreed in Part 1).
  - question: Why are the 45 new skins recolours with one extra part?
    answer: |
      One generic way (skins3d.ts) for 15 fighters instead of 45 hand-made looks; a test checks
      every skin has other colours and more parts. The looks still need a visual check.
